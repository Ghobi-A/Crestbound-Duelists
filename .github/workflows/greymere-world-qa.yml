name: Greymere world QA
on:
  push:
    branches: [world/greymere-rebuild]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y xvfb libgl1-mesa-dri
      - run: python -m pip install pytest pyyaml
      - run: python tools/materialize_overworld_v2.py
      - run: python tools/validate_godot_project.py && python -m pytest tests/test_world_locations.py tests/test_presentation_contracts.py -q
      - name: Capture actual Godot scenes
        run: |
          mkdir -p "$RUNNER_TEMP/world-qa"
          bash tools/capture_screenshots.sh "$RUNNER_TEMP/world-qa"
          for target in town_square court_gate west_lane lena_house inn silas_study; do
            xvfb-run -a "$HOME/.cache/crestbound-godot/Godot_v4.3-stable_linux.x86_64" --path game --fixed-fps 60 --resolution 320x180 res://scenes/tools/screenshot_capture.tscn -- "--target=$target" "--out=$RUNNER_TEMP/world-qa"
          done
      - name: Exercise movement, doors, saves and combat
        run: |
          set -o pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/qa-saves"
          GODOT="$HOME/.cache/crestbound-godot/Godot_v4.3-stable_linux.x86_64"
          timeout 90s "$GODOT" --headless --max-fps 120 --path game res://scenes/tools/world_smoke.tscn 2>&1 | tee "$RUNNER_TEMP/world-qa/world.log"
          grep -q 'WORLD_SMOKE: 0 failures' "$RUNNER_TEMP/world-qa/world.log"
          timeout 90s "$GODOT" --headless --max-fps 120 --path game res://scenes/tools/presentation_smoke.tscn 2>&1 | tee "$RUNNER_TEMP/world-qa/presentation.log"
          grep -q 'PRESENTATION_SMOKE: 0 failures' "$RUNNER_TEMP/world-qa/presentation.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: greymere-rendered-qa
          path: ${{ runner.temp }}/world-qa
