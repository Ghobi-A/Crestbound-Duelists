name: Balance snapshot

# Validates combat/data changes on pull requests. On main, also regenerates
# committed YAML-derived game exports and the recruiter analytical snapshot.

on:
  pull_request:
    branches: [main]
    paths:
      - "data/**"
      - "combat.py"
      - "models.py"
      - "loaders.py"
      - "ai.py"
      - "simulation.py"
      - "nash.py"
      - "balance_report.py"
      - "game/scripts/battle/**"
      - "tests/**"
      - "tools/generate_snapshot.py"
      - "export_game_data.py"
      - ".github/workflows/balance-snapshot.yml"
  push:
    branches: [main]
    paths:
      - "data/**"
      - "combat.py"
      - "models.py"
      - "loaders.py"
      - "ai.py"
      - "simulation.py"
      - "nash.py"
      - "balance_report.py"
      - "game/scripts/battle/**"
      - "tests/**"
      - "tools/generate_snapshot.py"
      - "export_game_data.py"
      - ".github/workflows/balance-snapshot.yml"
  workflow_dispatch:
    inputs:
      sims:
        description: "Simulations per matchup"
        default: "100000"
      seed:
        description: "Random seed (fixed, for reproducible results)"
        default: "42"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest -q

      - name: Regenerate YAML-derived game exports
        run: python export_game_data.py

      - name: Validate Godot project
        run: python tools/validate_godot_project.py

      - name: Quick balance diagnostics
        run: python balance_report.py --sims 500 --policy greedy

      - name: Validate analytical snapshot on pull request
        if: github.event_name == 'pull_request'
        run: |
          python tools/generate_snapshot.py \
            --sims 1000 \
            --policy-sims 250 \
            --seed 42 \
            --output /tmp/crestbound-pr-snapshot.json \
            --quiet

      - name: Regenerate production snapshot
        if: github.event_name != 'pull_request'
        run: |
          cp results/recruiter_snapshot.json /tmp/previous.json 2>/dev/null || true
          python tools/generate_snapshot.py \
            --sims "${{ github.event.inputs.sims || '100000' }}" \
            --seed "${{ github.event.inputs.seed || '42' }}"

      - name: Commit generated outputs if analysis or balance data changed
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # generated_at, runtime_seconds and git_commit change on every run,
          # so discard a metadata-only snapshot diff when the analytical
          # payload itself is unchanged.
          strip() { jq -S 'del(.generated_at, .runtime_seconds, .git_commit)' "$1"; }
          if [ -f /tmp/previous.json ] && \
             diff -q <(strip /tmp/previous.json) \
                     <(strip results/recruiter_snapshot.json) >/dev/null; then
            echo "Analysis unchanged — discarding metadata-only snapshot diff."
            git checkout -- results/recruiter_snapshot.json
          fi

          git add exports game/data results/recruiter_snapshot.json
          if git diff --cached --quiet; then
            echo "Generated outputs unchanged."
            exit 0
          fi

          git commit -m "chore: regenerate balance exports and snapshot"
          git push
