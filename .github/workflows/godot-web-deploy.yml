name: Godot web build and deploy

# Builds the single-threaded Godot Web export (game/export_presets.cfg,
# "Web" preset) and publishes it to GitHub Pages, so the recruiter-facing
# link stays current with `main` without a prebuilt binary living in the
# repository.

on:
  push:
    branches: [main]
    paths:
      - "game/**"
      - ".github/workflows/godot-web-deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.3-stable"

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot editor and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot/Godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot editor and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot/Godot
          chmod +x ~/godot/Godot

          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}
          curl -sSL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -r /tmp/templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}/
          rm -rf /tmp/godot.zip /tmp/templates.tpz /tmp/templates

      - name: Import project
        run: ~/godot/Godot --headless --path game --import

      - name: Export Web build
        run: |
          mkdir -p build/web
          ~/godot/Godot --headless --path game --export-release "Web" ../build/web/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
