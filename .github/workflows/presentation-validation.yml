name: Presentation validation

on:
  pull_request:
    paths:
      - "game/**"
      - "docs/rework/**"
      - "tests/test_*presentation*.py"
      - "tests/test_dialogue_assets.py"
      - "tests/test_sprite_assets.py"
      - "tests/test_greymere_layout.py"
      - "tests/test_cowork_visual_integration.py"
      - "tests/test_overworld_v2.py"
      - "tools/overworld_v2_art.py"
      - "tools/materialize_overworld_v2.py"
      - "tools/validate_godot_project.py"
      - ".github/workflows/presentation-validation.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  GODOT_VERSION: "4.3-stable"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Materialize authored overworld v2 atlases
        run: python tools/materialize_overworld_v2.py

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run regression suite
        run: python -m pytest -q

      - name: Validate Godot presentation contracts
        run: python tools/validate_godot_project.py

      - name: Cache Godot editor
        uses: actions/cache@v4
        with:
          path: ~/godot/Godot
          key: godot-editor-${{ env.GODOT_VERSION }}-v1

      - name: Install Godot editor
        run: |
          set -euo pipefail
          mkdir -p ~/godot
          if [[ ! -x ~/godot/Godot ]]; then
            curl -fsSL -o /tmp/godot.zip \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
            unzip -q /tmp/godot.zip -d ~/godot
            mv ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot/Godot
            chmod +x ~/godot/Godot
            rm -f /tmp/godot.zip
          fi
          ~/godot/Godot --headless --version

      - name: Import Godot project
        run: |
          set -o pipefail
          ~/godot/Godot --headless --path game --editor --import --quit 2>&1 | tee /tmp/godot-import.log
          ! grep -E "SCRIPT ERROR: Parse Error|Failed to load script" /tmp/godot-import.log
