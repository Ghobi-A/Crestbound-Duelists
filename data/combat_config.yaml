# Crestbound Duelists — global combat constants (single source of truth).
# Loaded by loaders.load_combat_config() and consumed by combat.py,
# ai.py, nash.py, and the Godot client (via exports/combat_config.json).

# Turn order: each combatant rolls SPD + U(0, speed_band).
# A raw speed gap at or beyond the band therefore guarantees order;
# closer speeds remain uncertain. The ratio field is retained for schema
# compatibility with v2.1 but is no longer used by initiative resolution.
speed_band: 20
guaranteed_speed_ratio: 2.0

# Damage roll: final damage = power × 2·ATK/(ATK+DEF) × U(variance_low, variance_high)
variance_low: 0.85
variance_high: 1.0

# Brace: acting second in the 1v1 lab / committing Brace in the game
# multiplies the relevant defence stat. 1.20 is roughly 9% mitigation
# at equal attacking and defending stats under the compressed formula.
brace_multiplier: 1.20

# Hard cap on battle length; ties resolve by remaining HP.
max_turns: 100

# Temporary stat modifiers expire after this many turns.
stat_decay_duration: 3
