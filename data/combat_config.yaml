# Crestbound Duelists — global combat constants (single source of truth).
# Loaded by loaders.load_combat_config() and consumed by combat.py,
# ai.py, nash.py, and the Godot client (via exports/combat_config.json).

# Turn order: each combatant rolls SPD + U(0, speed_band).
# A raw speed gap at or beyond the band therefore guarantees order;
# closer speeds remain uncertain. The ratio field is retained for schema
# compatibility with v2.1 but is no longer used by initiative resolution.
speed_band: 20
guaranteed_speed_ratio: 2.0

# Damage roll: final damage = power × 2·ATK/(ATK+DEF) × U(variance_low, variance_high)
variance_low: 0.85
variance_high: 1.0

# Brace: acting second in the 1v1 lab / committing Brace in the game
# multiplies the relevant defence stat. v2.3 uses 1.15 because base HP is
# materially higher and move power is lower; Brace should be meaningful
# without stretching tank matchups beyond the target combat horizon.
brace_multiplier: 1.15

# Hard cap on battle length; ties resolve by remaining HP.
max_turns: 100

# Temporary stat modifiers expire after this many turns.
stat_decay_duration: 3

# ── Combat System 3.0 (party battles: party_combat.py + Godot runtime) ──

# Rows: close moves (range <= melee_range) lose force reaching into or
# out of the back row.
melee_range: 1
back_row_melee_multiplier: 0.75

# Brace, Item and Awaken commitments resolve before every attack.
priority_bonus: 10000

# Crest passives and pre-hit Resonance events read "low HP" as below this.
low_hp_threshold: 0.5

# Attack properties (impact / edge / arcane) against a unit's affinity
# profile. A weakness hit also Staggers: the target loses Brace for the
# round and a pending telegraph slips one round.
weakness_multiplier: 1.3
resist_multiplier: 0.75

# A telegraphed attack released into a Brace lands at this fraction.
telegraph_brace_multiplier: 0.5

# Resonance every Crest-bearer gains for these events, on top of their
# Crest's own resonance_gain table.
generic_resonance:
  weakness_hit: 10
  telegraph_braced: 8

# How statuses tick. "dot" statuses deal their value at the end of each
# round and are not extended by the +1 decision-round rule.
statuses:
  hexed: {kind: control, name: Hexed}
  bleed: {kind: dot, name: Bleeding}
  scorched: {kind: dot, name: Scorched}
  exposed: {kind: mark, name: Exposed}

# Enemy decision profiles: weights on each candidate (move, target).
#   damage            × expected damage (mid roll × accuracy)
#   ko                + if the best roll would knock the target out
#   status / debuff   + for a fresh status / first debuff on the target
#   self_risk(_hp)    − per self-debuff when below self_risk_hp
#   finisher          + × (1 − target HP ratio)
#   exposed           + against an Exposed or Staggered target
#   target_resonance  + × the target's Resonance
#   punish_brace      + for guard-breaking moves against a repeat Bracer
#   target_protected  + against a protected unit
#   dispel            + for a dispel against a buffed target
#   brace_below_hp / brace_value: Brace scores brace_value below that HP
#   self_move         score of a self-targeted move
#   awaken            1 = awaken as soon as ready
#   noise             + U(0, noise), seeded, so choices stay readable but
#                     not fully predictable
# "legacy" reproduces the original greedy AI exactly.
ai_profiles:
  legacy: {damage: 1.0, ko: 1000, status: 8, debuff: 4, self_risk: 6, self_risk_hp: 0.35, awaken: 1, noise: 0}
  aggressive: {damage: 1.0, ko: 1000, status: 3, debuff: 2, finisher: 4, exposed: 6, awaken: 1, self_move: 4, noise: 2}
  defensive: {damage: 0.85, ko: 1000, status: 6, debuff: 4, self_risk: 8, self_risk_hp: 0.5, brace_below_hp: 0.35, brace_value: 22, awaken: 1, self_move: 9, noise: 2}
  disruptive: {damage: 0.6, ko: 800, status: 14, debuff: 9, target_resonance: 0.12, punish_brace: 6, awaken: 1, self_move: 6, noise: 2}
  opportunistic: {damage: 0.9, ko: 1200, status: 4, debuff: 3, finisher: 18, exposed: 12, target_protected: 5, awaken: 1, self_move: 5, noise: 2}
  boss: {damage: 1.0, ko: 900, status: 8, debuff: 5, finisher: 6, exposed: 4, punish_brace: 10, dispel: 12, awaken: 1, self_move: 6, noise: 1.5}
