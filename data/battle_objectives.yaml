# Crestbound Duelists — battle objective definitions for the tactical layer.
# params are interpreted by the battle controller for each objective_type.

battle_objectives:
  - id: defeat_all
    name: Defeat All Enemies
    description: The battle is won when every enemy unit has fallen.
    objective_type: eliminate
    params: {}

  - id: hold_crest_node
    name: Hold the Crest Node
    description: >-
      Keep a friendly unit on the dormant Crest node for the required
      number of consecutive turns.
    objective_type: hold_tile
    params:
      terrain_id: crest_node
      turns_required: 3

  - id: survive_assault
    name: Survive the Assault
    description: Keep at least one friendly unit alive for the given turns.
    objective_type: survive
    params:
      turns_required: 6

  - id: protect_ally
    name: Protect the Marked Ally
    description: The battle is lost if the marked ally falls.
    objective_type: protect
    params:
      unit_tag: protected
