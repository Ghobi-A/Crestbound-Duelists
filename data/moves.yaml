# Crestbound Duelists — move definitions (single source of truth).
#
# Fields used by the Python combat engine today:
#   move_type, slot, power, accuracy, target_stat_mods, self_stat_mods,
#   is_buff_move, status_effects (first entry), cooldown_turns.
# Tactical fields (range, area_shape, target_rule, resource_cost,
# terrain_effects) are consumed by the Godot client and reserved for the
# party-battle layer; they do not affect the 1v1 balance simulation.
#
# v2.3 numerical chassis baseline. Damage is intentionally lower than v2.2
# to create 6–8 round fights where cooldowns, modifiers, Hex and Brace have
# enough temporal space to matter.

moves:
  # ── Warrior ────────────────────────────────────────────────────────
  - id: power_slash
    name: Power Slash
    class_id: warrior
    move_type: physical
    slot: basic
    power: 16
    accuracy: 1.0
    cooldown_turns: 0
    range: 1
    area_shape: single
    target_rule: enemy
    resource_cost: 0
    target_stat_mods: []
    self_stat_mods: []
    is_buff_move: false
    status_effects: []
    terrain_effects: []
    tags: [reliable]
    animation_key: slash
    vfx_key: slash_arc
    ai_tags: [damage]

