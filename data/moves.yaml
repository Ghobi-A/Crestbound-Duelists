# Crestbound Duelists — move definitions (single source of truth).
#
# v2.3 numerical chassis. Damage is intentionally lower than v2.2 to create
# 6–8 round fights. Signature riders are sized by their marginal future HP
# swing under the real compressed formula; repeated same-direction riders
# refresh rather than stack.

# Combat System 3.0 fields (all optional, read by party_combat.py and
# the Godot runtime):
#   property        impact | edge | arcane — checked against affinities
#   speed           initiative modifier for this move (−20..+20)
#   telegraph       true: one round winding up, released the next round
#   target_rule     enemy (default) | all_enemies | self
#   resonance_bonus Resonance the user gains when the move is used
#   dispel_buffs    true: strips the target's positive modifiers
#   aftermath_self_statuses: statuses on the user, hit or miss
#   status_effects[].value: damage per round for "dot" statuses
# class_id is a class for the six class pools (default kit in
# classes.yaml move_ids, alternatives in unlockable_moves), or one of:
# kai (Kai's provisional kits), entity (Bonded Entity granted moves),
# enemy (beasts, Riven manifestations and other non-Duelist foes).

