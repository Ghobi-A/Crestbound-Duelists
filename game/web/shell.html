<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
body {
	touch-action: none;
	/* iOS: a held button must never start a text selection or the callout. */
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
	margin: 0;
	border: 0 none;
	padding: 0;
	text-align: center;
	background-color: #1a1a2e;
}

#game-frame {
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	width: 100%;
	height: 100vh;
}

#canvas-wrap {
	position: relative;
	flex: none;
}

#canvas {
	display: block;
	margin: 0 auto;
	color: white;
	image-rendering: pixelated;
	image-rendering: crisp-edges;
}

#canvas:focus {
	outline: none;
}

#controls-note {
	font: 12px/1.5 monospace;
	color: #9aa0b8;
	text-align: center;
	margin-top: 8px;
	padding: 0 12px;
}

.godot {
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	color: #e0e0e0;
	background-color: #3b3943;
	background-image: linear-gradient(to bottom, #403e48, #35333c);
	border: 1px solid #45434e;
	box-shadow: 0 0 1px 1px #2f2d35;
}

/* Status display */

#status {
	position: absolute;
	left: 0;
	top: 0;
	right: 0;
	bottom: 0;
	display: flex;
	justify-content: center;
	align-items: center;
	/* don't consume click events - make children visible explicitly */
	visibility: hidden;
}

#status-progress {
	width: 61.8%;
	max-width: 366px;
	height: 7px;
	background-color: #38363A;
	border: 1px solid #444246;
	padding: 1px;
	box-shadow: 0 0 2px 1px #1B1C22;
	border-radius: 2px;
	visibility: visible;
}

#status-progress-inner {
	height: 100%;
	width: 0;
	box-sizing: border-box;
	transition: width 0.5s linear;
	background-color: #4a9eff;
	border: 1px solid #222223;
	box-shadow: 0 0 1px 1px #27282E;
	border-radius: 3px;
}

#status-indeterminate {
	height: 42px;
	visibility: visible;
	position: relative;
}

#status-indeterminate > div {
	width: 4.5px;
	height: 0;
	border-style: solid;
	border-width: 9px 3px 0 3px;
	border-color: #2b2b2b transparent transparent transparent;
	transform-origin: center 21px;
	position: absolute;
}

#status-indeterminate > div:nth-child(1) { transform: rotate( 22.5deg); }
#status-indeterminate > div:nth-child(2) { transform: rotate( 67.5deg); }
#status-indeterminate > div:nth-child(3) { transform: rotate(112.5deg); }
#status-indeterminate > div:nth-child(4) { transform: rotate(157.5deg); }
#status-indeterminate > div:nth-child(5) { transform: rotate(202.5deg); }
#status-indeterminate > div:nth-child(6) { transform: rotate(247.5deg); }
#status-indeterminate > div:nth-child(7) { transform: rotate(292.5deg); }
#status-indeterminate > div:nth-child(8) { transform: rotate(337.5deg); }

#status-notice {
	margin: 0 100px;
	line-height: 1.3;
	visibility: visible;
	padding: 4px 6px;
	visibility: visible;
}
		
#game-frame { height: 100dvh; }
#mobile-pad { display:none; position:fixed; inset:0; pointer-events:none; z-index:10; --dpad:48px; --act:52px; --gap:3px; }
#mobile-pad.active { display:block; }
#mobile-pad, #mobile-pad * { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
/* Idle buttons are see-through, so whatever they overlap stays readable. */
#mobile-pad button { pointer-events:auto; touch-action:none; user-select:none; -webkit-user-select:none; background:#18212c80; color:#ffffffd9; border:1px solid #ffffff59; border-radius:12px; width:var(--dpad); height:var(--dpad); font:bold 18px sans-serif; padding:0; }
#mobile-pad button.held { background:#62758ee6; color:white; border-color:#ffffffaa; }
#mobile-actions button { width:var(--act); height:var(--act); border-radius:50%; font-size:20px; }
#tap-to-begin { display:none; position:fixed; inset:0; z-index:20; align-items:center; justify-content:center; background:#05070bcc; color:#e9dcb8; font:600 20px Georgia, serif; letter-spacing:0.12em; touch-action:none; user-select:none; -webkit-user-select:none; }
#tap-to-begin.active { display:flex; }
/* layoutPad() sets the vertical position; the safe areas keep the sides clear of notches. */
#mobile-directions { position:absolute; left:max(4px, env(safe-area-inset-left)); bottom:max(8px, env(safe-area-inset-bottom)); display:grid; grid-template-columns:repeat(3,var(--dpad)); gap:var(--gap); }
#mobile-actions { position:absolute; right:max(4px, env(safe-area-inset-right)); bottom:max(8px, env(safe-area-inset-bottom)); display:flex; align-items:flex-end; gap:8px; }
#safe-probe { position:fixed; visibility:hidden; pointer-events:none; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<div id="game-frame">
			<div id="canvas-wrap">
				<canvas id="canvas" width="1280" height="720" tabindex="0">
					HTML5 canvas appears to be unsupported in the current browser.<br >
					Please try updating or use a different browser.
				</canvas>
				<div id="status">
					<div id="status-progress" style="display: none;" oncontextmenu="event.preventDefault();">
						<div id ="status-progress-inner"></div>
					</div>
					<div id="status-indeterminate" style="display: none;" oncontextmenu="event.preventDefault();">
						<div></div>
						<div></div>
						<div></div>
						<div></div>
						<div></div>
						<div></div>
						<div></div>
						<div></div>
					</div>
					<div id="status-notice" class="godot" style="display: none;"></div>
				</div>
			</div>
		</div>

		<div id="safe-probe"></div>
		<div id="tap-to-begin" role="button" aria-label="Tap to begin">TAP TO BEGIN</div>
		<div id="mobile-pad" aria-label="Touch game controls">
<div id="mobile-directions">
<span></span><button data-code="ArrowUp" aria-label="Up">▲</button><span></span>
<button data-code="ArrowLeft" aria-label="Left">◀</button><span></span><button data-code="ArrowRight" aria-label="Right">▶</button>
<span></span><button data-code="ArrowDown" aria-label="Down">▼</button><span></span>
</div>
<div id="mobile-actions"><button data-code="KeyX" aria-label="Cancel or back">B</button><button data-code="KeyZ" aria-label="Confirm or interact">A</button></div>
</div>
<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const engine = new Engine(GODOT_CONFIG);
const gdCanvas = document.getElementById('canvas');
// Backing buffer and CSS dimensions agree, keeping pointer coordinates correct.
function fitPixelCanvas() {
	// The device width, not the layout width: on a phone the last
	// orientation's wider canvas can stretch the layout viewport.
	const viewW = Math.min(window.innerWidth, screen.width > 0 && matchMedia('(orientation: portrait)').matches ? screen.width : Infinity);
	const viewH = window.visualViewport?.height || window.innerHeight;
	const available = Math.min(viewW / 320, viewH / 180);
	let scale = Math.max(1, Math.floor(available));
	let backing = scale;
	// An upright phone would only fit 1x. With the touch pad up, fill the
	// width instead: Godot still draws a whole-number multiple (the backing
	// buffer, sized for the screen's pixel density) and the page scales it.
	if (document.getElementById('mobile-pad').classList.contains('active') && viewH > viewW) {
		scale = Math.min((viewW - 8) / 320, (viewH * 0.55) / 180);
		backing = Math.max(1, Math.floor(scale * (window.devicePixelRatio || 1)));
	}
	const width = Math.round(320 * scale);
	const height = Math.round(180 * scale);
	gdCanvas.width = 320 * backing;
	gdCanvas.height = 180 * backing;
	gdCanvas.style.width = width + 'px';
	gdCanvas.style.height = height + 'px';
	const wrap = document.getElementById('canvas-wrap');
	wrap.style.width = width + 'px';
	wrap.style.height = height + 'px';
	layoutPad(width, height);
}
// The touch pad goes around the game, not over it, wherever the screen has
// room. The game draws at a whole-number scale (scale_mode="integer"), so
// the canvas cannot shrink to make room; the pad adapts instead:
//   * beside the canvas, centred in the side gutters, when they fit it;
//   * in a band under the canvas (portrait, tablets), the canvas above it;
//   * otherwise (most phones held sideways) beside it at the smallest
//     comfortable size, overlapping the canvas edge as little as it can.
function layoutPad(width, height) {
	const pad = document.getElementById('mobile-pad');
	const frame = document.getElementById('game-frame');
	if (!pad.classList.contains('active')) return;
	const probe = getComputedStyle(document.getElementById('safe-probe'));
	const inset = {left: parseFloat(probe.paddingLeft) || 0, right: parseFloat(probe.paddingRight) || 0, bottom: parseFloat(probe.paddingBottom) || 0};
	// The device width, not the layout width: on a phone the last
	// orientation's wider canvas can stretch the layout viewport.
	const viewW = Math.min(window.innerWidth, screen.width > 0 && matchMedia('(orientation: portrait)').matches ? screen.width : Infinity);
	const viewH = window.visualViewport?.height || window.innerHeight;
	const edge = 4, gap = 3, actionGap = 8;
	const size = (room, count, gaps, low, high) => Math.max(low, Math.min(high, Math.floor((room - gaps) / count)));
	const gutter = (viewW - width) / 2 - Math.max(edge, inset.left, inset.right);
	const band = viewH - height;
	const directions = document.getElementById('mobile-directions');
	const actions = document.getElementById('mobile-actions');
	let dpad, act;
	if (gutter < 3 * 40 + 2 * gap && band >= 3 * 44 + 2 * gap + 24 + inset.bottom) {
		// Under the canvas: big buttons, and the game centred in what is left.
		dpad = size(Math.min(viewW / 2 - 16, band - 24 - inset.bottom), 3, 2 * gap, 44, 60);
		act = Math.min(64, Math.round(dpad * 1.15));
		const padHeight = 3 * dpad + 2 * gap;
		const bottom = Math.max(16, inset.bottom + 8, (band - padHeight) / 3);
		frame.style.height = Math.max(height, viewH - padHeight - bottom) + 'px';
		for (const cluster of [directions, actions]) { cluster.style.top = ''; cluster.style.bottom = bottom + 'px'; }
	} else {
		dpad = size(gutter, 3, 2 * gap, 40, 52);
		act = size(gutter, 2, actionGap, 40, 56);
		frame.style.height = '';
		const padHeight = 3 * dpad + 2 * gap;
		directions.style.bottom = 'auto';
		actions.style.bottom = 'auto';
		directions.style.top = Math.round((viewH - padHeight) / 2) + 'px';
		actions.style.top = Math.round((viewH - act) / 2 + act * 0.6) + 'px';
	}
	pad.style.setProperty('--dpad', dpad + 'px');
	pad.style.setProperty('--act', act + 'px');
	pad.style.setProperty('--gap', gap + 'px');
}
fitPixelCanvas();
window.addEventListener('resize', fitPixelCanvas);
gdCanvas.addEventListener('pointerdown', function () {
	gdCanvas.focus();
});

// Preview adapter: reuse existing physical keyboard actions without changing gameplay.
function enableMobilePad() {
	const pad = document.getElementById('mobile-pad');
	if (!matchMedia('(any-pointer: coarse)').matches && !navigator.maxTouchPoints) return;
	pad.classList.add('active');
	// The game reads this to label its prompts A and B, like the buttons.
	window.crestboundTouchPad = true;
	fitPixelCanvas();
	const held = new Map();
	const keys = {KeyZ:'z', KeyX:'x'};
	function emit(code, down) {
		gdCanvas.dispatchEvent(new KeyboardEvent(down ? 'keydown' : 'keyup', {
			code, key: keys[code] || code, bubbles:true, cancelable:true
		}));
	}
	function release(id) {
		const button = held.get(id);
		if (!button) return;
		held.delete(id);
		if (![...held.values()].includes(button)) {
			button.classList.remove('held');
			emit(button.dataset.code, false);
		}
	}
	function releaseAll() { for (const id of [...held.keys()]) release(id); }
	for (const button of pad.querySelectorAll('button')) {
		button.addEventListener('pointerdown', event => {
			event.preventDefault();
			if (held.has(event.pointerId)) return;
			gdCanvas.focus();
			button.setPointerCapture(event.pointerId);
			const alreadyHeld = [...held.values()].includes(button);
			held.set(event.pointerId, button);
			button.classList.add('held');
			if (!alreadyHeld) emit(button.dataset.code, true);
		});
		for (const name of ['pointerup','pointercancel','lostpointercapture']) {
			button.addEventListener(name, event => release(event.pointerId));
		}
		button.addEventListener('contextmenu', event => event.preventDefault());
	}
	// iOS starts a selection from a long press anywhere on the pad, even the gaps.
	pad.addEventListener('touchstart', event => event.preventDefault(), {passive: false});
	document.addEventListener('selectstart', event => event.preventDefault());
	window.addEventListener('blur', releaseAll);
	window.addEventListener('pagehide', releaseAll);
	document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });
	// Phones block sound until a tap. The first tap only wakes the audio (a
	// harmless Shift press reaches the game, which resumes its AudioContext),
	// so it can never also choose a title-screen option.
	const gate = document.getElementById('tap-to-begin');
	gate.classList.add('active');
	gate.addEventListener('pointerdown', event => {
		event.preventDefault();
		gdCanvas.focus();
		emit('ShiftLeft', true);
		emit('ShiftLeft', false);
		gate.classList.remove('active');
	}, {once: true});
}
(function () {
	const INDETERMINATE_STATUS_STEP_MS = 100;
	const statusProgress = document.getElementById('status-progress');
	const statusProgressInner = document.getElementById('status-progress-inner');
	const statusIndeterminate = document.getElementById('status-indeterminate');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = 'hidden';

	let animationCallbacks = [];
	function animate(time) {
		animationCallbacks.forEach((callback) => callback(time));
		requestAnimationFrame(animate);
	}
	requestAnimationFrame(animate);

	function animateStatusIndeterminate(ms) {
		const i = Math.floor((ms / INDETERMINATE_STATUS_STEP_MS) % 8);
		if (statusIndeterminate.children[i].style.borderTopColor === '') {
			Array.prototype.slice.call(statusIndeterminate.children).forEach((child) => {
				child.style.borderTopColor = '';
			});
			statusIndeterminate.children[i].style.borderTopColor = '#dfdfdf';
		}
	}

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		[statusProgress, statusIndeterminate, statusNotice].forEach((elem) => {
			elem.style.display = 'none';
		});
		animationCallbacks = animationCallbacks.filter(function (value) {
			return (value !== animateStatusIndeterminate);
		});
		switch (mode) {
		case 'progress':
			statusProgress.style.display = 'block';
			break;
		case 'indeterminate':
			statusIndeterminate.style.display = 'block';
			animationCallbacks.push(animateStatusIndeterminate);
			break;
		case 'notice':
			statusNotice.style.display = 'block';
			break;
		case 'hidden':
			break;
		default:
			throw new Error('Invalid status mode');
		}
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		const msg = err.message || err;
		console.error(msg);
		setStatusNotice(msg);
		setStatusMode('notice');
		initializing = false;
	}

	// This project always exports with variant/thread_support=false
	// (single-threaded Web export), so don't require SharedArrayBuffer
	// / Cross-Origin-Isolation headers that only threaded builds need.
	const missing = Engine.getMissingFeatures({ threads: false });
	if (missing.length !== 0) {
		const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
		displayFailureNotice(missingMsg + missing.join('\n'));
	} else {
		setStatusMode('indeterminate');
		engine.startGame({
			'onProgress': function (current, total) {
				if (total > 0) {
					statusProgressInner.style.width = `${(current / total) * 100}%`;
					setStatusMode('progress');
					if (current === total) {
						// wait for progress bar animation
						setTimeout(() => {
							setStatusMode('indeterminate');
						}, 500);
					}
				} else {
					setStatusMode('indeterminate');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
			initializing = false;
			gdCanvas.focus();
			fitPixelCanvas();
			gdCanvas.dataset.ready = 'true';
			enableMobilePad();
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
