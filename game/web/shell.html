<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
body {
	touch-action: none;
	margin: 0;
	border: 0 none;
	padding: 0;
	text-align: center;
	background-color: #1a1a2e;
}

#game-frame {
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	width: 100%;
	height: 100vh;
}

#canvas-wrap {
	position: relative;
	flex: none;
}

#canvas {
	display: block;
	margin: 0 auto;
	color: white;
	image-rendering: pixelated;
	image-rendering: crisp-edges;
}

#canvas:focus {
	outline: none;
}

#controls-note {
	font: 12px/1.5 monospace;
	color: #9aa0b8;
	text-align: center;
	margin-top: 8px;
	padding: 0 12px;
}

.godot {
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	color: #e0e0e0;
	background-color: #3b3943;
	background-image: linear-gradient(to bottom, #403e48, #35333c);
	border: 1px solid #45434e;
	box-shadow: 0 0 1px 1px #2f2d35;
}

/* Status display */

#status {
	position: absolute;
	left: 0;
	top: 0;
	right: 0;
	bottom: 0;
	display: flex;
	justify-content: center;
	align-items: center;
	/* don't consume click events - make children visible explicitly */
	visibility: hidden;
}

#status-progress {
	width: 61.8%;
	max-width: 366px;
	height: 7px;
	background-color: #38363A;
	border: 1px solid #444246;
	padding: 1px;
	box-shadow: 0 0 2px 1px #1B1C22;
	border-radius: 2px;
	visibility: visible;
}

#status-progress-inner {
	height: 100%;
	width: 0;
	box-sizing: border-box;
	transition: width 0.5s linear;
	background-color: #4a9eff;
	border: 1px solid #222223;
	box-shadow: 0 0 1px 1px #27282E;
	border-radius: 3px;
}

#status-indeterminate {
	height: 42px;
	visibility: visible;
	position: relative;
}

#status-indeterminate > div {
	width: 4.5px;
	height: 0;
	border-style: solid;
	border-width: 9px 3px 0 3px;
	border-color: #2b2b2b transparent transparent transparent;
	transform-origin: center 21px;
	position: absolute;
}

#status-indeterminate > div:nth-child(1) { transform: rotate( 22.5deg); }
#status-indeterminate > div:nth-child(2) { transform: rotate( 67.5deg); }
#status-indeterminate > div:nth-child(3) { transform: rotate(112.5deg); }
#status-indeterminate > div:nth-child(4) { transform: rotate(157.5deg); }
#status-indeterminate > div:nth-child(5) { transform: rotate(202.5deg); }
#status-indeterminate > div:nth-child(6) { transform: rotate(247.5deg); }
#status-indeterminate > div:nth-child(7) { transform: rotate(292.5deg); }
#status-indeterminate > div:nth-child(8) { transform: rotate(337.5deg); }

#status-notice {
	margin: 0 100px;
	line-height: 1.3;
	visibility: visible;
	padding: 4px 6px;
	visibility: visible;
}
		
#game-frame { height: 100dvh; }
#mobile-pad { display:none; position:fixed; inset:0; pointer-events:none; z-index:10; }
#mobile-pad.active { display:block; }
#mobile-pad button { pointer-events:auto; touch-action:none; user-select:none; -webkit-user-select:none; background:#18212cbb; color:white; border:1px solid #ffffff88; border-radius:12px; width:48px; height:48px; font:bold 18px sans-serif; padding:0; }
#mobile-pad button.held { background:#62758e; }
#mobile-directions { position:absolute; left:max(8px, env(safe-area-inset-left)); bottom:max(8px, env(safe-area-inset-bottom)); display:grid; grid-template-columns:repeat(3,48px); gap:3px; }
#mobile-actions { position:absolute; right:max(8px, env(safe-area-inset-right)); bottom:max(8px, env(safe-area-inset-bottom)); display:flex; gap:8px; }
@media (orientation:portrait) { #mobile-directions,#mobile-actions { bottom: max(24px, env(safe-area-inset-bottom)); } }
</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<div id="game-frame">
			<div id="canvas-wrap">
				<canvas id="canvas" width="1280" height="720" tabindex="0">
					HTML5 canvas appears to be unsupported in the current browser.<br >
					Please try updating or use a different browser.
				</canvas>
				<div id="status">
					<div id="status-progress" style="display: none;" oncontextmenu="event.preventDefault();">
						<div id ="status-progress-inner"></div>
					</div>
					<div id="status-indeterminate" style="display: none;" oncontextmenu="event.preventDefault();">
						<div></div>
						<div></div>
						<div></div>
						<div></div>
						<div></div>
						<div></div>
						<div></div>
						<div></div>
					</div>
					<div id="status-notice" class="godot" style="display: none;"></div>
				</div>
			</div>
		</div>

		<div id="mobile-pad" aria-label="Touch game controls">
<div id="mobile-directions">
<span></span><button data-code="ArrowUp" aria-label="Up">▲</button><span></span>
<button data-code="ArrowLeft" aria-label="Left">◀</button><span></span><button data-code="ArrowRight" aria-label="Right">▶</button>
<span></span><button data-code="ArrowDown" aria-label="Down">▼</button><span></span>
</div>
<div id="mobile-actions"><button data-code="KeyX" aria-label="Cancel or back">B</button><button data-code="KeyZ" aria-label="Confirm or interact">A</button></div>
</div>
<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const engine = new Engine(GODOT_CONFIG);
const gdCanvas = document.getElementById('canvas');
// Backing buffer and CSS dimensions agree, keeping pointer coordinates correct.
function fitPixelCanvas() {
	const available = Math.min(window.innerWidth / 320, (window.visualViewport?.height || window.innerHeight) / 180);
	const scale = Math.max(1, Math.floor(available));
	const width = 320 * scale;
	const height = 180 * scale;
	gdCanvas.width = width;
	gdCanvas.height = height;
	gdCanvas.style.width = width + 'px';
	gdCanvas.style.height = height + 'px';
	const wrap = document.getElementById('canvas-wrap');
	wrap.style.width = width + 'px';
	wrap.style.height = height + 'px';
}
fitPixelCanvas();
window.addEventListener('resize', fitPixelCanvas);
gdCanvas.addEventListener('pointerdown', function () {
	gdCanvas.focus();
});

// Preview adapter: reuse existing physical keyboard actions without changing gameplay.
function enableMobilePad() {
	const pad = document.getElementById('mobile-pad');
	if (!matchMedia('(any-pointer: coarse)').matches && !navigator.maxTouchPoints) return;
	pad.classList.add('active');
	const held = new Map();
	const keys = {KeyZ:'z', KeyX:'x'};
	function emit(code, down) {
		gdCanvas.dispatchEvent(new KeyboardEvent(down ? 'keydown' : 'keyup', {
			code, key: keys[code] || code, bubbles:true, cancelable:true
		}));
	}
	function release(id) {
		const button = held.get(id);
		if (!button) return;
		held.delete(id);
		if (![...held.values()].includes(button)) {
			button.classList.remove('held');
			emit(button.dataset.code, false);
		}
	}
	function releaseAll() { for (const id of [...held.keys()]) release(id); }
	for (const button of pad.querySelectorAll('button')) {
		button.addEventListener('pointerdown', event => {
			event.preventDefault();
			if (held.has(event.pointerId)) return;
			gdCanvas.focus();
			button.setPointerCapture(event.pointerId);
			const alreadyHeld = [...held.values()].includes(button);
			held.set(event.pointerId, button);
			button.classList.add('held');
			if (!alreadyHeld) emit(button.dataset.code, true);
		});
		for (const name of ['pointerup','pointercancel','lostpointercapture']) {
			button.addEventListener(name, event => release(event.pointerId));
		}
		button.addEventListener('contextmenu', event => event.preventDefault());
	}
	window.addEventListener('blur', releaseAll);
	window.addEventListener('pagehide', releaseAll);
	document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });
}
(function () {
	const INDETERMINATE_STATUS_STEP_MS = 100;
	const statusProgress = document.getElementById('status-progress');
	const statusProgressInner = document.getElementById('status-progress-inner');
	const statusIndeterminate = document.getElementById('status-indeterminate');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = 'hidden';

	let animationCallbacks = [];
	function animate(time) {
		animationCallbacks.forEach((callback) => callback(time));
		requestAnimationFrame(animate);
	}
	requestAnimationFrame(animate);

	function animateStatusIndeterminate(ms) {
		const i = Math.floor((ms / INDETERMINATE_STATUS_STEP_MS) % 8);
		if (statusIndeterminate.children[i].style.borderTopColor === '') {
			Array.prototype.slice.call(statusIndeterminate.children).forEach((child) => {
				child.style.borderTopColor = '';
			});
			statusIndeterminate.children[i].style.borderTopColor = '#dfdfdf';
		}
	}

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		[statusProgress, statusIndeterminate, statusNotice].forEach((elem) => {
			elem.style.display = 'none';
		});
		animationCallbacks = animationCallbacks.filter(function (value) {
			return (value !== animateStatusIndeterminate);
		});
		switch (mode) {
		case 'progress':
			statusProgress.style.display = 'block';
			break;
		case 'indeterminate':
			statusIndeterminate.style.display = 'block';
			animationCallbacks.push(animateStatusIndeterminate);
			break;
		case 'notice':
			statusNotice.style.display = 'block';
			break;
		case 'hidden':
			break;
		default:
			throw new Error('Invalid status mode');
		}
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		const msg = err.message || err;
		console.error(msg);
		setStatusNotice(msg);
		setStatusMode('notice');
		initializing = false;
	}

	// This project always exports with variant/thread_support=false
	// (single-threaded Web export), so don't require SharedArrayBuffer
	// / Cross-Origin-Isolation headers that only threaded builds need.
	const missing = Engine.getMissingFeatures({ threads: false });
	if (missing.length !== 0) {
		const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
		displayFailureNotice(missingMsg + missing.join('\n'));
	} else {
		setStatusMode('indeterminate');
		engine.startGame({
			'onProgress': function (current, total) {
				if (total > 0) {
					statusProgressInner.style.width = `${(current / total) * 100}%`;
					setStatusMode('progress');
					if (current === total) {
						// wait for progress bar animation
						setTimeout(() => {
							setStatusMode('indeterminate');
						}, 500);
					}
				} else {
					setStatusMode('indeterminate');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
			initializing = false;
			gdCanvas.focus();
			fitPixelCanvas();
			gdCanvas.dataset.ready = 'true';
			enableMobilePad();
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
