; Export preset config for Crestbound Duelists.
;
; Single "Web" preset targeting a static WebAssembly/WebGL2 build with
; thread support disabled (variant/thread_support=false) — the
; single-threaded Web export path Godot has defaulted to since 4.3, so
; the build needs no Cross-Origin-Opener/Embedder-Policy headers and
; works on ordinary static hosting such as GitHub Pages. Uses the
; project's existing Compatibility (gl_compatibility) renderer and a
; custom shell (web/shell.html) with a loading screen and a controls
; note.

[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../build/web/index.html"
patch_list=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell="res://web/shell.html"
html/head_include=""
html/canvas_resize_policy=0
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=1
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)
